<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application — Senior Software Engineer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; padding: 40px; }
    .form-card { max-width: 650px; margin: 0 auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #0f172a; }
    p.sub { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: #1e293b; }
    input, select, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    button[type="submit"] { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Acme Tech — Job Application</h1>
    <p class="sub">Role: Senior Software Engineer • Location: Remote</p>

    <form id="job-app-form">
      <div class="row">
        <div class="group">
          <label for="first_name">First Name *</label>
          <input type="text" id="first_name" name="first_name" autocomplete="given-name" required />
        </div>
        <div class="group">
          <label for="last_name">Last Name *</label>
          <input type="text" id="last_name" name="last_name" autocomplete="family-name" required />
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" required />
        </div>
      </div>

      <div class="group">
        <label for="current_company">Current Company / Employer</label>
        <input type="text" id="current_company" name="current_company" placeholder="e.g. Acme Corp" />
      </div>

      <div class="row">
        <div class="group">
          <label for="linkedin_url">LinkedIn Profile URL</label>
          <input type="url" id="linkedin_url" name="linkedin_url" placeholder="https://linkedin.com/in/username" />
        </div>
        <div class="group">
          <label for="portfolio_url">Portfolio URL</label>
          <input type="url" id="portfolio_url" name="portfolio_url" placeholder="https://yourportfolio.com" />
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="notice_period">Notice Period</label>
          <input type="text" id="notice_period" name="notice_period" placeholder="e.g. Immediate / 30 Days" />
        </div>
        <div class="group">
          <label for="expected_salary">Expected Salary / CTC</label>
          <input type="text" id="expected_salary" name="expected_salary" placeholder="e.g. $140,000" />
        </div>
      </div>

      <div class="group">
        <label for="work_auth">Are you authorized to work in this country?</label>
        <input type="text" id="work_auth" name="work_auth" placeholder="e.g. Citizen / Permanent Resident" />
      </div>

      <div class="group">
        <label for="cover_letter">Why do you want to join our company? (Essay)</label>
        <textarea id="cover_letter" rows="3" placeholder="Tell us why you are interested..."></textarea>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
