<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkyHigh Airlines — Passenger Details & Flight Checkout</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 40px; }
    .card { max-width: 700px; margin: 0 auto; background: white; padding: 32px; border-radius: 12px; border: 1px solid #e2e8f0; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .section-title { font-size: 15px; font-weight: 700; margin-top: 20px; margin-bottom: 12px; color: #334155; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    .group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13px; font-weight: 600; color: #1e293b; }
    input, select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Flight Booking — Passenger 1 (Adult)</h1>
    <p style="color: #64748b; font-size: 13px;">Flight: SFO ➔ LHR (Flight #SH402)</p>

    <form id="flight-form">
      <div class="section-title">Passenger Information</div>
      <div class="row">
        <div class="group">
          <label for="p_first">Passenger First Name *</label>
          <input type="text" id="p_first" name="passenger_first_name" autocomplete="given-name" required />
        </div>
        <div class="group">
          <label for="p_last">Passenger Last Name *</label>
          <input type="text" id="p_last" name="passenger_last_name" autocomplete="family-name" required />
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="p_dob">Date of Birth *</label>
          <input type="date" id="p_dob" name="dob" autocomplete="bday" required />
        </div>
        <div class="group">
          <label for="p_gender">Gender</label>
          <select id="p_gender" name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-binary">Non-binary</option>
          </select>
        </div>
      </div>

      <div class="section-title">Travel & Passport Documents</div>
      <div class="row">
        <div class="group">
          <label for="passport_no">Passport Number *</label>
          <input type="text" id="passport_no" name="passport_number" placeholder="Passport #" required />
        </div>
        <div class="group">
          <label for="passport_country">Country of Issue</label>
          <input type="text" id="passport_country" name="issuing_country" placeholder="e.g. United States" />
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="passport_exp">Passport Expiry Date</label>
          <input type="date" id="passport_exp" name="passport_expiry" />
        </div>
        <div class="group">
          <label for="ktn">Known Traveler Number / TSA PreCheck</label>
          <input type="text" id="ktn" name="ktn" placeholder="e.g. 987654321" />
        </div>
      </div>

      <div class="section-title">Emergency Contact Details</div>
      <div class="row">
        <div class="group">
          <label for="em_name">Emergency Contact Person</label>
          <input type="text" id="em_name" name="emergency_contact_name" />
        </div>
        <div class="group">
          <label for="em_phone">Emergency Phone Number</label>
          <input type="tel" id="em_phone" name="emergency_contact_phone" />
        </div>
      </div>

      <button type="submit">Proceed to Seat Selection</button>
    </form>
  </div>
</body>
</html>
